# docker-compose.yml — Stack base UrbIA en .102
# Servicios: PostgreSQL, MongoDB, Redis, Adminer, Mongo Express,
#            simulator-ami.
# Ver plan-trabajo/semana1.md (E1, E3) y CLAUDE.md.
services:

  postgres:
    image: postgres:16-alpine
    container_name: urbia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data-volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbia

  mongo:
    image: mongo:7.0
    container_name: urbia-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ./data-volumes/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbia

  redis:
    image: redis:7-alpine
    container_name: urbia-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./data-volumes/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - urbia

  adminer:
    image: adminer:latest
    container_name: urbia-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urbia

  mongo-express:
    image: mongo-express:latest
    container_name: urbia-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - urbia

  simulator-ami:
    build:
      context: ./services/simulator-ami
      dockerfile: Dockerfile
    image: urbia/simulator-ami:0.1.0
    container_name: urbia-simulator-ami
    restart: unless-stopped
    environment:
      # Broker MQTT externo en .101 (modo anónimo, ver .env.example).
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      # Parámetros operativos del simulador.
      SIMULATOR_NUM_METERS: "10"
      SIMULATOR_PUBLISH_RATE_HZ: "1"
      LOG_LEVEL: "INFO"
    networks:
      - urbia

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    image: urbia/backend:0.1.0
    container_name: urbia-backend
    restart: unless-stopped
    environment:
      # PostgreSQL: dentro del bridge se resuelve por el nombre del
      # servicio. NO se hereda POSTGRES_HOST del .env (que apunta a
      # 192.168.0.102 para herramientas en el host).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Broker MQTT externo en .101 (modo anónimo, ver .env.example).
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPIC_TELEMETRY: ${MQTT_TOPIC_TELEMETRY}
      MQTT_CLIENT_ID: "urbia-backend"
      # HTTP
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      LOG_LEVEL: "INFO"
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - urbia

networks:
  urbia:
    name: urbia-network
    driver: bridge
