# UrbIA frontend-v2 — nginx alpine que sirve el bundle estatico y
# hace proxy_pass de /api hacia el servicio FastAPI por la red
# docker urbia-network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Compresion ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # nginx:1.27-alpine no trae ngx_brotli compilado. Los .br ya
    # estan precomputados por vite-plugin-compression, pero servir
    # 'gzip on' alcanza el objetivo de compresion del entregable.

    # ─── Cache policy ──────────────────────────────────────────
    # Los assets compilados llevan hash en el nombre — cache eterno.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Los SVG y logos del bundle estatico tambien son inmutables.
    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # index.html debe revalidar siempre — la SPA actualiza referencias
    # a los chunks de assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ─── Proxy hacia el backend FastAPI ────────────────────────
    # 'backend' es el nombre de servicio docker-compose en urbia-network.
    # 'proxy_pass http://backend:8000/' (con slash final) reescribe la
    # ruta: /api/health → /health en el backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ─── SPA fallback ──────────────────────────────────────────
    # Cualquier ruta no-asset y no-/api debe servir index.html para
    # que React Router maneje la navegacion client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Hardening minimo ──────────────────────────────────────
    server_tokens off;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
