[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbia-simulator"
version = "0.1.0"
description = "Simulador AMI mínimo para UrbIA-UNAL: publica telemetría sintética de 10 medidores virtuales a un broker MQTT."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cristhiam Daniel Campos Julca", email = "ccamposj@unal.edu.co" },
]
dependencies = [
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
]

[project.scripts]
urbia-simulator = "urbia_simulator.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/urbia_simulator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["urbia_simulator"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
