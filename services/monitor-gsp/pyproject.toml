[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbia-monitor-gsp"
version = "0.1.0"
description = "Monitor espectral GSP de UrbIA-UNAL: construcción del grafo AMI, Laplaciano y transformada de Fourier sobre grafos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cristhiam Daniel Campos Julca", email = "ccamposj@unal.edu.co" },
]

# El núcleo depende SÓLO de numpy. El notebook 01_gsp_hello_world (E6)
# validó que la pipeline A → L → L_norm → eigh → GFT no necesita pygsp
# ni scipy: con 20–30 nodos por zona, la matriz densa de distancias y
# `np.linalg.eigh` resuelven en milisegundos. Mantener una única
# dependencia es lo que permite importar `urbia_monitor_gsp.graph`
# desde los notebooks sin arrastrar el servicio.
dependencies = [
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Lectura de medidores desde PostgreSQL. Vive fuera del núcleo a
# propósito: `urbia_monitor_gsp.graph` no importa nada de esto.
db = [
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.4,<3",
]
# El monitor como proceso: broker y exportador de métricas. Vive fuera del
# núcleo por la misma razón que `db`: `runtime` y `publisher` no importan
# paho ni prometheus, así que el ciclo entero se prueba sin ninguno de los
# dos, y el núcleo sigue corriendo en un notebook con sólo numpy.
service = [
    "urbia-monitor-gsp[db]",
    "paho-mqtt>=2.1,<3",
    "prometheus-client>=0.20,<1",
]
dev = [
    # Autorreferencia a los extras: la suite incluye tests/test_db.py, que
    # importa psycopg en el nivel de módulo, y los tests del servicio, que
    # importan paho y prometheus. Sin esto, instalar sólo [dev] rompe la
    # recolección de pytest entera.
    "urbia-monitor-gsp[service]",
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2",
]

[project.scripts]
# El monitor como proceso. Requiere el extra `[service]`; sin él, el
# comando existe pero falla al importar paho con un ImportError que dice
# qué falta.
urbia-monitor-gsp = "urbia_monitor_gsp.service.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/urbia_monitor_gsp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requiere PostgreSQL real (no corre en CI por defecto)",
]

[tool.coverage.run]
branch = true
source = ["urbia_monitor_gsp"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# 90% es el mínimo que CLAUDE.md §8.2 exige al núcleo doctoral, no el
# 80% general de services/.
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints obligatorios, CLAUDE.md §8.1)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # reglas propias de ruff
]
ignore = [
    "D203",    # incompatible con D211
    "D213",    # incompatible con D212
    # RUF001/002/003 marcan como "ambiguos" los caracteres unicode que
    # parecen letras latinas. Este módulo documenta fórmulas: sigma, lambda,
    # tau y el signo × aparecen en docstrings, comentarios y mensajes de
    # error porque así están escritas en la tesis. Sustituirlos por ASCII
    # alejaría el código de las fórmulas y empeoraría lo que ve quien depura.
    "RUF001",  # carácter ambiguo en string
    "RUF002",  # carácter ambiguo en docstring
    "RUF003",  # carácter ambiguo en comentario
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Los tests no necesitan docstring por función; el nombre del test
# (test_<funcion>_<escenario>_<resultado>) ya documenta el caso.
# D107 se suma por los dobles —`ClienteFalso`, `PublicadorRoto`,
# `BaseFalsa`—: su `__init__` sólo guarda contadores, y documentarlo
# alargaría el archivo sin decir nada que la clase no diga ya.
"tests/**" = ["D100", "D101", "D102", "D103", "D107", "ANN201"]

[tool.ruff.lint.pep8-naming]
# Nomenclatura matemática: A (adyacencia), D (grados), L (Laplaciano),
# U (base de Fourier). Renombrarlas a snake_case alejaría el código de
# las fórmulas del Capítulo 3 de Aristizábal que implementa.
ignore-names = [
    "A", "D", "L", "U",
    "L_norm", "D_inv_sqrt", "x_hat",
    # Variantes derivadas de las anteriores en los tests, donde hacen
    # falta dos versiones de la misma matriz a la vez (original y
    # permutada, o la misma base recalculada).
    "A_perm", "U_perm", "U_otra_vez",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# Sin excepciones para tests: `strict` aplica igual a src/ y a tests/. Un
# test mal tipado es un test que puede estar verificando otra cosa.
