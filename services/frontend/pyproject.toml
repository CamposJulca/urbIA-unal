[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbia-frontend"
version = "0.1.0"
description = "Dashboard Streamlit de UrbIA-UNAL: visualiza telemetría AMI consumiendo el backend FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cristhiam Daniel Campos Julca", email = "ccamposj@unal.edu.co" },
]
dependencies = [
    "streamlit>=1.41,<2",
    "requests>=2.32,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "requests-mock>=1.12,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/urbia_frontend"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["urbia_frontend"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
