[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbia-event-injector"
version = "0.1.0"
description = "Inyector de eventos correlacionados sobre el grafo AMI de UrbIA-UNAL, con verdad de referencia explícita."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cristhiam Daniel Campos Julca", email = "ccamposj@unal.edu.co" },
]

# numpy por la aritmética y monitor-gsp por ZoneGraph, que es lo que define
# la vecindad sobre la que se construye un evento colectivo. La dependencia
# va en un solo sentido y así debe quedar: el monitor no importa nada de
# acá, y este paquete no importa nada del detector. Ese aislamiento es lo
# que hace creíble la evaluación, y hay un test que lo verifica.
dependencies = [
    "numpy>=1.26,<3",
    "urbia-monitor-gsp",
]

[project.optional-dependencies]
# Sólo la usa el test de integración que recontrasta el perfil congelado
# contra la base viva. El paquete en sí no toca PostgreSQL.
db = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    "urbia-event-injector[db]",
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<0.13",
    "mypy>=1.11,<2",
]

[project.scripts]
urbia-inject = "urbia_events.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/urbia_events"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requiere PostgreSQL real (no corre en CI por defecto)",
]

[tool.coverage.run]
branch = true
source = ["urbia_events"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# El inyector produce la verdad de referencia contra la que se puntúa el
# detector. Un error acá no da un resultado malo: da un resultado que
# parece bueno. Mismo mínimo que el núcleo doctoral (CLAUDE.md §8.2).
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "ANN", "B", "SIM", "RUF",
]
ignore = [
    "D203",    # incompatible con D211
    "D213",    # incompatible con D212
    # Los docstrings y los mensajes de error citan fórmulas: sigma, lambda y ×
    # aparecen como están escritos en la tesis. Pasarlos a ASCII alejaría el
    # código de las fórmulas y empeoraría los mensajes que ve quien depura.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "ANN201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
