[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urbia-backend"
version = "0.1.0"
description = "Backend FastAPI de UrbIA-UNAL: consume telemetría AMI por MQTT, persiste a PostgreSQL y expone endpoints REST."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Cristhiam Daniel Campos Julca", email = "ccamposj@unal.edu.co" },
]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.32",
    "asyncpg>=0.29,<0.31",
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<0.29",
]

[project.scripts]
urbia-backend = "urbia_backend.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/urbia_backend"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requiere PostgreSQL y MQTT reales (no corre en CI por defecto)",
]

[tool.coverage.run]
branch = true
source = ["urbia_backend"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
